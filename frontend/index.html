<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>SPHEREx Time-Domain Sky Explorer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body class="bg-[#0B0E14] text-[#E6EAF2] font-sans antialiased">
